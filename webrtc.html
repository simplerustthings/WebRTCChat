<!DOCTYPE html>
<!--
  Super Mesh Chat — hostless PeerJS full-mesh chat, voice, video and files (single file, no build step).
  Run: open this file, or `python -m http.server` and browse to it. Keep ./peerjs.min.js beside it.
  Room = "superconf-mesh-" + sanitized password. No account, no host, no history.
  Slots: each tab claims the lowest free id "<room>-0" … "<room>-7"; max 8 peers.
  Chat/control uses "ctl" (JSON); file bytes use "bin" (raw); voice/video uses PeerJS media calls.
  Files resume by missing ranges and are SHA-256 verified; previews for jpg/png/webp/avif/mp4/mp3.
  Known limits: 8 peers, no offline history; large incoming files buffer in RAM when no disk picker is available.
  Test: 3+ windows, send 500 MB to several peers, kill a peer's network mid-transfer, confirm resume/hash.
  Voice starts on join; use the per-peer volume slider; camera/screen buttons are beside the paperclip.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Mesh Chat — P2P Chat, Voice & Files</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
<script src="./peerjs.min.js"></script>
<script>
// Local-first PeerJS 1.5.4; same CDN fallback chain as the mesh checker.
(function () {
  if (typeof Peer !== 'undefined') return;
  var urls = [
    'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js',
    'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js'
  ];
  (function next(i) {
    if (typeof Peer !== 'undefined') { window.dispatchEvent(new Event('peerjs-ready')); return; }
    if (i >= urls.length) { window.__peerjsFailed = true; return; }
    var s = document.createElement('script');
    s.src = urls[i];
    s.onload = function () { setTimeout(function () { next(i + 1); }, 60); };
    s.onerror = function () { next(i + 1); };
    document.head.appendChild(s);
  })(0);
})();
</script>
<style>

}

button.primary{background:var(--acc2);border-color:var(--acc2);color:#fff}

  #sidebar.open{transform:none}

  #chat{padding:10px}
  .msg,.msg.transfer{max-width:92%}

  .tool{width:36px;height:36px;font-size:16px}
  #msg{min-width:120px}
  #sendBtn{padding:8px 12px}
}

</style>

<body>
<div id="appLayout">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark">S</div>
      <div class="brand-text">
        <h1>Super Mesh Chat</h1>

      </div>
    </div>

<script>
'use strict';
/* =====================================================================
   Hostless 8-slot mesh. One ctl (JSON) + one bin (raw) data connection
   per peer. Slots are PeerJS ids <room>-0 … <room>-7; the smallest free
   slot is claimed, then every other slot is dialed. No host, no timer
   gossip — join/leave events only. File bytes never share a channel with
   chat, and the sender uses DataChannel bufferedAmount for backpressure.
   ===================================================================== */

const $ = s => document.querySelector(s);
const PREFIX = 'superconf-mesh-';
const SLOTS = 8;
const CHUNK_S = 16 * 1024;
const CHUNK_L = 64 * 1024;
const HIGH_WATER = 4 * 1024 * 1024;   // pause file sends above this
const LOW_WATER = 1 * 1024 * 1024;    // bufferedAmountLowThreshold
const ACK_EVERY = 1 * 1024 * 1024;
const LS = 'chat.';
const STUN = [
  { urls: 'stun:stun.cloudflare.com:3478' },
  { urls: 'stun:stun.l.google.com:19302' }
];

const lsGet = k => { try { return localStorage.getItem(LS + k) || ''; } catch (_) { return ''; } };
const lsSet = (k, v) => { try { localStorage.setItem(LS + k, String(v)); } catch (_) {} };
const shortId = id => !id ? '?' : id === myId ? 'me' : (ROOM_ID && id.indexOf(ROOM_ID + '-') === 0 ? 's' + id.slice(ROOM_ID.length + 1) : id.slice(0, 8));
const fmtBytes = n => {
  n = Number(n) || 0;
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  if (n < 1073741824) return (n / 1048576).toFixed(2) + ' MB';
  return (n / 1073741824).toFixed(2) + ' GB';
};
const fmtEta = s => !isFinite(s) || s == null ? '—' : s < 60 ? Math.max(0, Math.round(s)) + 's' : Math.floor(s / 60) + 'm ' + String(Math.round(s % 60)).padStart(2, '0') + 's';
const fmtTime = () => new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit' });
const now = () => Date.now();
const randomId = () => (crypto.randomUUID ? crypto.randomUUID() : now().toString(36) + Math.random().toString(36).slice(2, 10));
const stripBidi = s => String(s == null ? '' : s).replace(/[\u200b-\u200f\u202a-\u202e\u2060-\u2069\ufeff]/g, '');
const cleanText = s => stripBidi(s).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/g, '').slice(0, 2000);
const cleanName = s => stripBidi(s).replace(/[\u0000-\u001f\u007f]/g, '').replace(/[\\/:*?"<>|]/g, '_').replace(/^[.\s]+/, '').slice(0, 80) || 'file';
const PREVIEW_IMAGE = ['image/jpeg', 'image/png', 'image/webp', 'image/avif'];
const PREVIEW_VIDEO = ['video/mp4'];
const PREVIEW_AUDIO = ['audio/mpeg', 'audio/mp3'];
async function sniffPreviewType(blob) {
  if (!blob || !blob.slice) return null;
  let b;
  try { b = new Uint8Array(await blob.slice(0, 32).arrayBuffer()); } catch (_) { return null; }
  if (b.length < 12) return null;
  const s = (o, n) => String.fromCharCode.apply(null, b.subarray(o, o + n));
  if (b[0] === 0xff && b[1] === 0xd8 && b[2] === 0xff) return 'image/jpeg';
  if (b[0] === 0x89 && s(1, 3) === 'PNG') return 'image/png';
  if (s(0, 4) === 'RIFF' && s(8, 4) === 'WEBP') return 'image/webp';
  if (s(4, 4) === 'ftyp') {
    const brand = s(8, 4);
    if (brand === 'avif' || brand === 'avis') return 'image/avif';
    if (['isom', 'iso2', 'mp41', 'mp42', 'avc1', 'M4V ', 'dash'].includes(brand)) return 'video/mp4';
  }
  if (s(0, 3) === 'ID3' || (b[0] === 0xff && (b[1] & 0xe0) === 0xe0)) return 'audio/mpeg';
  return null;
}
function previewKind(type) {
  if (PREVIEW_IMAGE.includes(type)) return 'image';
  if (PREVIEW_VIDEO.includes(type)) return 'video';
  if (PREVIEW_AUDIO.includes(type)) return 'audio';
  return '';
}

function log(...args) { try { console.log('[super-mesh]', ...args); } catch (_) {} }
let toastTimer = 0;
function toast(text) {
  const el = $('#toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}
let AC = null;
function ac() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume().catch(() => {});
    return AC;
  } catch (_) { return null; }
}
function tone(f0, f1, dur, type, vol, delay) {
  const c = ac(); if (!c) return;
  const t = c.currentTime + (delay || 0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(c.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
const playJoin = () => tone(660, 880, 0.15, 'sine', 0.16, 0);
const playLeave = () => tone(440, 330, 0.18, 'sine', 0.14, 0);
const playNotify = () => { tone(880, 880, 0.08, 'square', 0.07, 0); tone(1320, 1320, 0.06, 'sine', 0.05, 0.06); };

/* ---------------- state ---------------- */
let peer = null;
let myId = null;
let mySlot = -1;
let myName = '';
let ROOM_ID = '';
let joining = false;
let sig = 'idle';
let epoch = 0;
let myInstance = '';
let previousIds = [];
let lastRecreateAt = 0;
let sigAttempts = 0;
let autoAccept = true;
let pingTimer = 0;
let statusTimer = 0;
let reconnectTimer = 0;
let claimRetry = 0;
let gossipTimer = 0;
let wakeLock = null;
let wakePending = false;
let micStream = null, camStream = null, screenStream = null, outgoing = null;
let mediaPrimePromise = null;
let mediaPrimeEpoch = -1;
let mediaPrimeProbe = false;
let mediaPermissionGranted = false;
let mediaEpoch = 0;
let localVideoEl = null;
const pendingPlay = new Set();
let mediaUnblockWired = false;
const peerCards = new Map();   // id -> {el,dot,name,ping,path,vol}

const peers = new Map();       // id -> peer record
const xfers = new Map();       // transfer id -> sender/receiver record
const recvFids = new Map();    // uint32 file id -> receiver record
const seenChat = new Set();    // chat message ids
const chatOut = new Map();     // chat id -> {sent:Set,total,el}
const deathLog = [];           // {at,pid} for last-resort churn detector
let dynamicIce = [];           // cached TURN iceServers (localStorage only)

  const targets = [...peers.values()].filter(r => r.confirmed && r.id !== myId && r.ctl && r.ctl.open);
  if (!targets.length) { toast('No peers with an open control channel'); return; }
  for (const file of files) for (const r of targets) startSend(file, r);
  toast('Sending ' + files.length + ' file' + (files.length > 1 ? 's' : '') + ' to ' + targets.length + ' peer' + (targets.length > 1 ? 's' : ''));
}

/* ---------------- settings / leave / startup ---------------- */
function saveSettings() {
  lsSet('name', $('#name').value.trim());
  lsSet('autoAccept', $('#autoAccept').checked ? '1' : '0');
  autoAccept = $('#autoAccept').checked;
}
function loadSettings() {
  const name = lsGet('name') || ('Guest-' + Math.floor(1000 + Math.random() * 9000));
  $('#name').value = name;
  myName = name.slice(0, 24);
  $('#pass').value = lsGet('pass');
  $('#autoAccept').checked = lsGet('autoAccept') !== '0';
  autoAccept = $('#autoAccept').checked;
}
function leaveRoom(quiet) {
  const wasJoining = joining;
  joining = false;
  clearSignalTimers();
  stopTimers();
  clearTimeout(gossipTimer); gossipTimer = 0;
  if (myId) {
    const bye = { t: 'leave', id: myId };
    peers.forEach(r => sendCtl(r, bye));
  }
  stopLocalMedia();
  for (const xf of [...xfers.values()]) {
    if (!xf.complete && !xf.cancelled) cancelXfer(xf);
    if (xf.downloadUrl) { try { URL.revokeObjectURL(xf.downloadUrl); } catch (_) {} }
    if (xf.previewUrl) { try { URL.revokeObjectURL(xf.previewUrl); } catch (_) {} }
  }
  xfers.clear(); recvFids.clear();
  epoch++;
  peers.forEach(r => {
    clearDialTimer(r, 'ctl'); clearDialTimer(r, 'bin');
    if (r.ctl) { r.ctl._drop = true; try { r.ctl.close(); } catch (_) {} }
    if (r.bin) { r.bin._drop = true; try { r.bin.close(); } catch (_) {} }
  });
  peers.clear(); peerCards.clear();
  const old = peer;
  peer = null; myId = null; mySlot = -1; ROOM_ID = ''; myInstance = ''; previousIds = [];
  if (old) { old._dead = true; try { old.destroy(); } catch (_) {} }
  $('#chat').textContent = '';
  $('#peerList').textContent = '';
  $('#mediaBar').textContent = '';
  closeMediaOverlay();
  $('#joinBtn').disabled = typeof Peer === 'undefined';
  $('#leaveBtn').disabled = true;
  setSig('idle');
  syncWakeLock();
  updateMediaButtons();
  if (wasJoining && !quiet) toast('Left room');
  log('left room');
}
function wireUI() {
  $('#joinForm').addEventListener('submit', e => { e.preventDefault(); joinRoom(); });
  $('#leaveBtn').addEventListener('click', () => leaveRoom(false));
  $('#sendBtn').addEventListener('click', sendChat);
  $('#msg').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); } });
  $('#attachBtn').addEventListener('click', () => $('#fileInput').click());
  $('#fileInput').addEventListener('change', e => { sendFiles(e.target.files); e.target.value = ''; });
  $('#camBtn').addEventListener('click', toggleCam);
  $('#screenBtn').addEventListener('click', toggleScreen);
  $('#autoAccept').addEventListener('change', () => saveSettings());
  $('#name').addEventListener('change', () => { myName = cleanText($('#name').value).slice(0, 24); lsSet('name', myName); });
  $('#mediaOverlay').addEventListener('click', e => {
    if (e.target === $('#overlayVideo') || e.target === $('#overlayImg')) return;
    closeMediaOverlay();
  });
  $('#btnMenu').addEventListener('click', () => { $('#sidebar').classList.add('open'); $('#sidebarOverlay').classList.add('show'); });
  $('#sidebarOverlay').addEventListener('click', () => { $('#sidebar').classList.remove('open'); $('#sidebarOverlay').classList.remove('show'); });

  let dragN = 0;
  window.addEventListener('dragenter', e => { e.preventDefault(); dragN++; $('#drop').classList.add('show'); });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('dragleave', e => { e.preventDefault(); if (--dragN <= 0) { dragN = 0; $('#drop').classList.remove('show'); } });
  window.addEventListener('drop', e => {
    e.preventDefault(); dragN = 0; $('#drop').classList.remove('show');
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) sendFiles(e.dataTransfer.files);
  });
  document.addEventListener('paste', e => {
    const f = e.clipboardData && e.clipboardData.files;
    if (f && f.length) { e.preventDefault(); sendFiles(f); }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') syncWakeLock();
  });
  window.addEventListener('beforeunload', e => {
    if (activeTransfers()) { e.preventDefault(); e.returnValue = ''; }
  });
  window.addEventListener('pagehide', () => {
    try {
      if (myId) { const bye = { t: 'leave', id: myId }; peers.forEach(r => sendCtl(r, bye)); }
      stopLocalMedia();
      if (peer) { peer._dead = true; peer.destroy(); }
    } catch (_) {}
  });
  window.addEventListener('peerjs-ready', updateStatus);
  window.addEventListener('error', e => log('window error: ' + (e.message || 'unknown')));
  window.addEventListener('unhandledrejection', e => log('unhandled rejection: ' + ((e.reason && e.reason.message) || e.reason || 'unknown')));
}
function boot() {
  loadSettings();
  loadCachedTurn();
  wireUI();
  updateClock();
  setInterval(updateClock, 1000);
  updateStatus();
  primeMedia(true); // ask for mic + webcam at visit, release tracks immediately
  log('ready · PeerJS ' + (typeof Peer === 'undefined' ? 'loading…' : 'loaded'));
  if (typeof Peer === 'undefined') {
    setSig('loading PeerJS…');
    let tries = 0;
    const iv = setInterval(() => {
      tries++;
      if (typeof Peer !== 'undefined' || window.__peerjsFailed || tries > 60) {
        clearInterval(iv);
        if (typeof Peer === 'undefined') setSig('PeerJS failed to load');
        else { setSig('idle'); log('PeerJS loaded'); }
      }
    }, 250);
  }
}
boot();
</script>
